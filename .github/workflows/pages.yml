name: Deploy web demo to GitHub Pages

# Builds the Next.js frontend in static-demo mode (data baked in as JSON from
# data/demo.duckdb) and publishes frontend/out to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/export_static_data.py"
      - "data/demo.duckdb"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export static data snapshot
        run: |
          pip install duckdb pytz pandas
          python scripts/export_static_data.py --db data/demo.duckdb --out frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_DATA_MODE: static
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
