name: Live poll (API-Football)

# Match-window poller with a self-seeding warehouse loop:
# restore DB artifact -> seed from scratch when absent (FD ingest + dbt +
# AF backfill + team map) -> poll today's fixtures -> re-upload for next run.
# Skips API steps without API_FOOTBALL_KEY; push sending needs VAPID_*.

on:
  schedule:
    # Every 30 min, Sat/Sun 12:00-22:30 UTC (European match windows).
    - cron: '*/30 12-22 * * 6,0'
  workflow_dispatch:
    inputs:
      league:
        description: API-Football league id
        required: false
        default: '39'

permissions:
  contents: read
  actions: read

concurrency:
  group: live-poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
      FOOTBALL_COMPETITION: ${{ vars.FOOTBALL_COMPETITION || 'PL' }}
      FOOTBALL_SEASON: ${{ vars.FOOTBALL_SEASON || '2026' }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      DUCKDB_PATH: data/football.duckdb
    steps:
      - uses: actions/checkout@v4

      - name: Restore warehouse from latest poll
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: live-poll.yml
          name: football-live-db
          path: data/
          if_no_artifact_found: warn

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Seed warehouse when starting fresh
        if: hashFiles('data/football.duckdb') == ''
        run: |
          python -m ingestion.run_ingestion
          cd football_dbt && dbt build --profiles-dir . && cd ..
          python -m ingestion.run_af_backfill --league ${{ inputs.league || '39' }} --season 2024 --max-events 10
          python -m scripts.build_team_map --league ${{ inputs.league || '39' }} --season 2024

      - name: Run live poll
        if: env.API_FOOTBALL_KEY != ''
        run: python -m ingestion.run_live_poll --league ${{ inputs.league || '39' }}

      - name: Preserve warehouse for next poll
        uses: actions/upload-artifact@v4
        with:
          name: football-live-db
          path: data/football.duckdb
          if-no-files-found: warn
          retention-days: 14
