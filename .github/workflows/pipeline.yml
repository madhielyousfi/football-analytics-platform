name: Football analytics pipeline

on:
  workflow_dispatch:
    inputs:
      competition:
        description: Football-data.org competition code
        required: false
        default: PL
      season:
        description: Season starting year
        required: false
        default: '2026'
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: read

jobs:
  build-warehouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FOOTBALL_API_TOKEN: ${{ secrets.FOOTBALL_API_TOKEN }}
      FOOTBALL_COMPETITION: ${{ inputs.competition || vars.FOOTBALL_COMPETITION || 'PL' }}
      FOOTBALL_SEASON: ${{ inputs.season || vars.FOOTBALL_SEASON || '2026' }}
      DUCKDB_PATH: data/football.duckdb
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Python code
        run: python -m pytest -q
      - name: Ingest football data
        run: python -m ingestion.run_ingestion
      - name: Build and test dbt models
        working-directory: football_dbt
        run: dbt build --profiles-dir .
      - name: Preserve DuckDB warehouse
        uses: actions/upload-artifact@v7
        with:
          name: football-analytics-${{ github.run_id }}
          path: data/football.duckdb
          if-no-files-found: error
          retention-days: 14
