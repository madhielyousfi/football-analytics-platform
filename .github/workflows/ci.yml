name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DBT_DUCKDB_PATH: ${{ github.workspace }}/data/football-ci.duckdb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (tracked files only)
        run: |
          if git ls-files | grep -qx '\.env'; then
            echo "::error::.env is tracked by git; credentials must stay untracked"
            exit 1
          fi
          if git grep -nEI '(x-apisports-key|X-Auth-Token).{0,3}[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' -- . ':!*.lock' ':!package-lock.json' | grep -v 'mock\|Mock\|placeholder\|secret-value\|test-key\|test-token\|example\|your-'; then
            echo "::error::possible secret committed; use placeholders in tests and docs"
            exit 1
          fi
          echo "Secret scan passed"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint Python
        run: |
          python -m pip install ruff
          ruff check ingestion scripts tests api --select E9,F

      - name: Python tests
        run: python -m pytest -q

      - name: Validate workflows
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('workflows valid')"

      - name: Create token-free raw fixture
        run: python -m scripts.create_ci_database --db-path "$DBT_DUCKDB_PATH"

      - name: Parse dbt project
        working-directory: football_dbt
        run: dbt parse --profiles-dir .

      - name: Compile dbt project
        working-directory: football_dbt
        run: dbt compile --profiles-dir .

      - name: Build dbt models and run data tests
        working-directory: football_dbt
        run: dbt build --profiles-dir .

      - name: Record dbt results
        run: python -m scripts.record_dbt_results --db "$DBT_DUCKDB_PATH" --run-results football_dbt/target/run_results.json

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and production build
        run: |
          npm run typecheck
          npm run build
